name: medieval-realm-prod

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: medieval-realm/backend:prod
  restart: always
  working_dir: /var/www/html
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-medieval_realm}
    DB_USERNAME: ${DB_USERNAME:-medieval}
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the shell or a root .env}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in the shell or a root .env}
  volumes:
    - ./backend:/var/www/html
    - backend-vendor:/var/www/html/vendor
  networks:
    - realm

services:
  laravel:
    <<: *backend
    command: >
      sh -c "php artisan migrate --force
      && php artisan db:seed --force
      && php artisan config:cache
      && php artisan route:cache
      && php artisan event:cache
      && php-fpm"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - laravel
      - vue
      - reverb
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - realm

  vue:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_MODE: production
    image: medieval-realm/frontend:prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - realm

  reverb:
    <<: *backend
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  horizon:
    <<: *backend
    command: php artisan horizon
    stop_signal: SIGTERM
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *backend
    command: php artisan schedule:work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-medieval_realm}
      POSTGRES_USER: ${DB_USERNAME:-medieval}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the shell or a root .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-medieval} -d ${DB_DATABASE:-medieval_realm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - realm

  redis:
    image: redis:7-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in the shell or a root .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - realm

networks:
  realm:
    driver: bridge

volumes:
  backend-vendor:
  postgres-data:
  redis-data:
  certbot-www:
  certbot-conf:
